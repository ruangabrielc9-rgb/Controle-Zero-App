name: Compilar APK do Catálogo

on:
  push:
    branches: [ catalogo ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk CatalogoZero.apk

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: CatalogoZero-apk
          path: CatalogoZero.apk

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: catalogo-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Catálogo Zero v1.0.${{ github.run_number }}
          files: CatalogoZero.apk

      - name: Guardar o registro do erro (so se falhar)
        if: failure()
        run: |
          cp build.log /tmp/build.log || echo "sem log" > /tmp/build.log
          git config user.name "actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan catalogo-log
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/build.log build.log
          git add build.log
          git commit -m "log do erro de compilacao"
          git push -f origin catalogo-log
