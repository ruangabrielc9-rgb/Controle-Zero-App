<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Catálogo Zero</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090a">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Catálogo Zero">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Bancada Zero: fundo preto, vermelho de sinalização, cartões de vidro fosco, texto técnico em mono */
:root{
  --bg:#09090a; --bg2:#121214; --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.10); --ink:#f2f2f3; --muted:#8f8f97;
  --red:#e5232d; --red-soft:rgba(229,35,45,.16); --red-glow:rgba(229,35,45,.38);
  --good:#4fd68a; --good-bg:rgba(79,214,138,.14);
  --warn:#f3b64c; --warn-bg:rgba(243,182,76,.14);
  --grey:#a9a9b1; --grey-bg:rgba(169,169,177,.14);
  --bad:#ff7a7a; --bad-bg:rgba(255,122,122,.13);
  --info:#8cc4ff; --info-bg:rgba(108,180,255,.14);
  --font-display:"Arial Narrow","Helvetica Neue Condensed","Roboto Condensed",system-ui,sans-serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(900px 340px at 50% -80px,rgba(229,35,45,.14),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:120px}

.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 82%,rgba(9,9,10,0));padding-block:14px 10px;display:grid;gap:10px}
.brand{display:flex;align-items:center;gap:12px}
.ring{flex:none;width:38px;height:38px;border-radius:50%;border:5px solid var(--red);box-shadow:0 0 14px var(--red-glow),inset 0 0 10px var(--red-glow)}
.brand .tt{flex:1;min-width:0}
.brand small{display:block;font:500 10.5px var(--font-mono);letter-spacing:.22em;color:var(--red);text-transform:uppercase}
.brand h1{margin:0;font:700 30px/1 var(--font-display);letter-spacing:.02em;text-transform:uppercase}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;font-size:15px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--red);color:#fff;box-shadow:0 2px 14px var(--red-glow)}
.tab span{font:500 12px var(--font-mono);opacity:.85;margin-left:4px}
.search{width:100%;min-width:0;border:1px solid var(--line);background:var(--glass);border-radius:12px;padding:12px 14px;font-size:16px;-webkit-appearance:none;appearance:none}
.search::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--red-soft);border-color:var(--red);color:#fff}
.chips.small .chip{font-size:13px;padding:4px 12px}
.count-line{font:500 12px var(--font-mono);color:var(--muted);letter-spacing:.04em;min-height:18px}

.dica{border:1px solid var(--red);background:var(--red-soft);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;font-size:14px}
.dica p{margin:0;flex:1}
.dica button{border:0;background:transparent;color:var(--ink);font-size:22px;line-height:1;padding:0 4px}

#avisos{display:grid;gap:10px;padding-top:6px}
.aviso{border:1px solid var(--red);background:var(--red-soft);border-radius:12px;padding:12px 14px;display:grid;gap:10px;font-size:14px}
.aviso p{margin:0}
.aviso .row .btn{flex:1 1 120px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding-top:8px}
.card{display:flex;flex-direction:column;min-width:0;text-align:left;padding:0;border:1px solid var(--line);background:var(--glass);border-radius:14px;overflow:hidden}
.thumb{position:relative;display:block;aspect-ratio:4/3;background:var(--bg2);border-bottom:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.nophoto{position:absolute;inset:10px;display:grid;place-items:center;border:1px dashed var(--line);border-radius:8px;font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nfotos{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.7);color:#fff;border-radius:999px;font:500 11px var(--font-mono);padding:2px 8px}
.cbody{display:flex;flex-direction:column;gap:3px;padding:10px 11px 12px;min-width:0}
.cod{font:500 11px var(--font-mono);letter-spacing:.08em;color:var(--red);text-transform:uppercase}
.ctipo{font:500 10.5px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cname{font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ccode{font:500 12px var(--font-mono);color:var(--grey);overflow-wrap:anywhere}
.cnote{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pill{border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.grey{background:var(--grey-bg);color:var(--grey)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.red{background:var(--red-soft);color:#ff8087}
.pill.info{background:var(--info-bg);color:var(--info)}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.chk{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500}
.chk[aria-pressed="true"]{background:var(--red-soft);border-color:var(--red);color:#fff}
.mrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow b{font:500 15px var(--font-mono);white-space:nowrap}
.mrow.tot{font-weight:700;color:#ff8087}
.qty{display:flex;align-items:center;gap:10px}
.qty b{flex:1;text-align:center;font:700 30px var(--font-display)}
.qty .btn{min-width:72px}
.h3s{margin:0;font:700 20px var(--font-display);text-transform:uppercase;letter-spacing:.03em}

.grp{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grp h3{margin:0;font:700 22px var(--font-display);text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.grp span{font:500 12px var(--font-mono);color:var(--muted);flex:none}
.alist{display:grid;gap:10px}
.acard{display:flex;gap:12px;min-width:0;text-align:left;padding:10px;border:1px solid var(--line);background:var(--glass);border-radius:14px;align-items:stretch}
.athumb{position:relative;flex:none;width:84px;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg2);border:1px solid var(--line)}
.athumb img{width:100%;height:100%;object-fit:cover;display:block}
.athumb .nophoto{inset:6px;font-size:9px;letter-spacing:.04em}
.abody{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}

.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:14px;padding:32px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;font:700 22px var(--font-display);text-transform:uppercase;color:var(--ink);margin-bottom:6px}

.fab{position:fixed;z-index:8;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;border:0;background:var(--red);color:#fff;border-radius:999px;padding:14px 20px 14px 16px;font-weight:700;font-size:16px;box-shadow:0 6px 24px var(--red-glow)}
.fab svg{width:20px;height:20px}

.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.sheet-bar h2{margin:0;font:700 20px var(--font-display);text-transform:uppercase;letter-spacing:.04em;flex:1;text-align:center}
.sheet-in{max-width:640px;margin:0 auto;display:grid;gap:16px;padding:16px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.btn{border:1px solid var(--line);background:var(--glass2);border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 2px 14px var(--red-glow)}
.btn.ghost{background:transparent;border-color:transparent;padding-inline:6px;color:#ff6870}
.btn.danger{color:var(--bad);border-color:rgba(255,122,122,.5);background:transparent}
.btn.danger.armed{background:var(--bad);color:#1a0000}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}

.gallery{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.gallery button{flex:0 0 86%;max-width:520px;scroll-snap-align:center;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg2);aspect-ratio:4/3}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.dcod{font:500 15px var(--font-mono);letter-spacing:.12em;color:var(--red);text-transform:uppercase}
.dtitle{margin:2px 0 0;font:700 30px/1.05 var(--font-display);text-transform:uppercase;overflow-wrap:anywhere}
.dmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
dl{margin:0;display:grid;gap:12px}
.dl-item{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.dl-item.hi{border-color:rgba(229,35,45,.55);background:var(--red-soft)}
dt{font:500 10.5px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.sect{display:grid;gap:10px}
.sect>h3{margin:0;font:700 20px var(--font-display);text-transform:uppercase;letter-spacing:.03em}
.link{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--glass);border-radius:12px;padding:10px 12px}
.link b{display:block;overflow-wrap:anywhere}
.link small{color:var(--muted)}

label.f{display:grid;gap:5px;min-width:0}
label.f>span{font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.in{width:100%;min-width:0;border:1px solid var(--line);background:var(--glass);border-radius:12px;padding:11px 12px;font-size:16px;-webkit-appearance:none;appearance:none}
.in option{background:#1a1a1d;color:var(--ink)}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea.in{min-height:90px;resize:vertical}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.foto{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg2)}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.75);color:#fff;font-size:18px;line-height:1;padding:0}
.addfoto{aspect-ratio:1;border:1.5px dashed var(--red);border-radius:12px;background:var(--red-soft);color:#ff8087;display:grid;place-items:center;align-content:center;gap:4px;font-size:13px;font-weight:600;padding:6px;text-align:center}
.addfoto svg{width:26px;height:26px}
.note{font-size:13px;color:var(--muted);margin:0}
.box{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.box h3{margin:0;font:700 20px var(--font-display);text-transform:uppercase}

#zoom{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.94);display:grid;place-items:center;padding:12px}
#zoom img{max-width:100%;max-height:100%;object-fit:contain}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#111;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: no-preference){
  .card,.acard,.fab,.chip,.btn,.tab{transition:transform .12s ease,background-color .12s ease}
  .card:active,.acard:active,.fab:active{transform:scale(.98)}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="ring" aria-hidden="true"></div>
      <div class="tt"><small>Bancada Zero</small><h1>Catálogo</h1></div>
      <button class="btn ghost" type="button" id="btnBackup">Backup</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" type="button" id="tabEstoque" aria-selected="true">Estoque<span id="nEstoque"></span></button>
      <button class="tab" role="tab" type="button" id="tabAdapt" aria-selected="false">Adaptações<span id="nAdapt"></span></button>
    </div>
    <input id="q" class="search" type="search" placeholder="Buscar" autocomplete="off">
    <div class="chips" id="chipsTipo" aria-label="Filtrar por tipo"></div>
    <div class="chips small" id="chipsEstado" aria-label="Filtrar por estado"></div>
    <div class="chips small" id="chipsSetor" aria-label="Filtrar por setor com problema" hidden></div>
    <div class="count-line" id="countLine"></div>
  </header>
  <div id="dica" class="dica" hidden><p><b>Para instalar no iPhone:</b> toque em Compartilhar (quadrado com seta) e depois em Adicionar à Tela de Início.</p><button type="button" id="dicaX" aria-label="Fechar">×</button></div>
  <div id="avisos"></div>
  <main id="main"></main>
</div>

<button class="fab" id="fab" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  <span id="fabTxt">Novo item</span>
</button>

<section class="sheet" id="sheetDetail" hidden></section>
<section class="sheet" id="sheetForm" hidden></section>
<section class="sheet" id="sheetBackup" hidden></section>
<div id="zoom" hidden><img alt=""></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  "use strict";
  var TIPOS=[
    {n:"Placa principal",p:"PM"},{n:"Fonte",p:"FT"},{n:"T-CON",p:"TC"},{n:"Tela",p:"TL"},{n:"Barra de LED",p:"BL"},
    {n:"Carcaça",p:"CC"},{n:"TV completa",p:"TV"},{n:"Componente",p:"CP"},{n:"Outro",p:"OU"}
  ];
  var ORIGENS=["Comprei","Ganhei","Cliente desistiu","Troca","Outro"];
  var CONDS=["Nova","Usada"];
  var TEM=["Controle","Pé ou suporte","Cabo de força","Carcaça","Tela inteira","Placas completas","Caixas de som"];
  var ESTADOS={
    func:{l:"Funcional",c:"good"},
    conserto:{l:"Dá conserto",c:"warn"},
    teste:{l:"Sem testar",c:"info"},
    pecas:{l:"Só peças",c:"grey"},
    desc:{l:"Descartada",c:"bad"}
  };
  var SETORES=["Fonte","Backlight ou barra de LED","Main (processador)","Memória","T-CON","Tela quebrada","Tela (risca ou linha)","Áudio","HDMI e entradas","Wi-Fi e Bluetooth","Outro"];
  var RESULT={
    certo:{l:"Deu certo",c:"good"},
    parcial:{l:"Parcial",c:"warn"},
    nao:{l:"Não deu",c:"bad"}
  };

  var $=function(s){return document.querySelector(s);};
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});};
  var norm=function(s){return String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();};
  var main=$("#main"), sheetD=$("#sheetDetail"), sheetF=$("#sheetForm"), sheetB=$("#sheetBackup");

  var items=[], adapt=[], lixo=[], meta={}, seq={}, tab="estoque";
  var fTipo="", fEstado="", fSetor="", fFonte=false, fCond="", fRes="", q="";
  var curForm=null;
  var stack=[], dbh=null, toastTimer=null, urls=[], detailUrls=[];

  function toast(msg){
    var t=$("#toast"); t.textContent=msg; t.hidden=false;
    clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.hidden=true;},3500);
  }
  function newId(){
    try{ if(crypto&&crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
    return Date.now().toString(36)+Math.random().toString(36).slice(2,10);
  }
  var BRL=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
  function money(v){ return (typeof v==="number"&&isFinite(v))?BRL.format(v):""; }
  function moneyIn(v){ return (typeof v==="number"&&isFinite(v))?String(v).replace(".",","):""; }
  function parseMoney(t){
    var x=String(t==null?"":t).replace(/[^\d.,]/g,"");
    if(!x)return null;
    if(x.indexOf(",")>=0)x=x.replace(/\./g,"").replace(",",".");
    else if(/^\d{1,3}(\.\d{3})+$/.test(x))x=x.replace(/\./g,"");
    var n=parseFloat(x); return isFinite(n)?n:null;
  }
  function tipoInfo(n){ for(var i=0;i<TIPOS.length;i++){ if(TIPOS[i].n===n)return TIPOS[i]; } return TIPOS[TIPOS.length-1]; }

  /* ---------- armazenamento no celular (IndexedDB) ---------- */
  var VERSAO="1.1";
  function openDb(){
    return new Promise(function(res,rej){
      var r=indexedDB.open("catalogo-zero",2);
      r.onupgradeneeded=function(){
        var d=r.result;
        ["itens","adapt","lixo"].forEach(function(n){ if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:"id"}); });
        if(!d.objectStoreNames.contains("meta"))d.createObjectStore("meta",{keyPath:"k"});
      };
      r.onsuccess=function(){ var d=r.result; d.onversionchange=function(){d.close();}; res(d); };
      r.onerror=function(){rej(r.error);};
      r.onblocked=function(){rej(new Error("blocked"));};
    });
  }
  function run(store,mode,fn){
    return new Promise(function(res,rej){
      var t=dbh.transaction(store,mode), s=t.objectStore(store), r=fn(s);
      t.oncomplete=function(){res(r?r.result:undefined);};
      t.onerror=function(){rej(t.error);};
      t.onabort=function(){rej(t.error||new Error("abort"));};
    });
  }
  /* varias lojas na mesma transacao: ou grava tudo ou nao grava nada */
  function tx(stores,fn){
    return new Promise(function(res,rej){
      var t=dbh.transaction(stores,"readwrite");
      t.oncomplete=function(){res();};
      t.onerror=function(){rej(t.error);};
      t.onabort=function(){rej(t.error||new Error("abort"));};
      try{ fn(t); }catch(e){ try{t.abort();}catch(x){} }
    });
  }
  /* le o registro mais novo dentro da transacao e grava a mudanca (evita perder toques seguidos) */
  function update(store,id,fn){
    return new Promise(function(res,rej){
      var t=dbh.transaction(store,"readwrite"), s=t.objectStore(store), out=null, g=s.get(id);
      g.onsuccess=function(){ var cur=g.result; if(!cur)return; out=fn(Object.assign({},cur)); s.put(out); };
      t.oncomplete=function(){res(out);};
      t.onerror=function(){rej(t.error);};
      t.onabort=function(){rej(t.error||new Error("abort"));};
    });
  }
  function loadAll(){
    return Promise.all([
      run("itens","readonly",function(s){return s.getAll();}),

  /* numeracao dos codigos: nunca repete, nem de item que foi para a lixeira */
  function recalcSeq(){
    var m=Object.assign({},meta.seq||{}), re=/^([A-Z]{2})-(\d+)$/;
    var todos=items.concat(lixo.filter(function(x){return x.tipo==="item"&&x.reg;}).map(function(x){return x.reg;}));
    todos.forEach(function(i){
      var k=re.exec(i.cod||""); if(k){ var n=parseInt(k[2],10); if(!(m[k[1]]>=n))m[k[1]]=n; }
    });
    seq=m;

      t.objectStore("lixo").put({id:kind+":"+rec.id,tipo:kind,apagadoEm:Date.now(),reg:rec});

  /* ---------- copia automatica (so no app Android) ---------- */
  var autoTimer=null, autoBusy=false, MIN_AUTO=30*60*1000, DIA=86400000;
  function temAuto(){ return !!(window.AndroidBridge&&window.AndroidBridge.beginAuto); }
  function mudou(){
    meta.sujo=Date.now();
    run("meta","readwrite",function(s){return s.put({k:"sujo",v:meta.sujo});}).catch(function(){});
    agendarAuto();
  }
  function agendarAuto(ms){
    if(!temAuto())return;
    clearTimeout(autoTimer);
    autoTimer=setTimeout(function(){rodarAuto(false);},ms==null?15000:ms);
  }
  function stamp(){
    var d=new Date(), p=function(n){return String(n).padStart(2,"0");};
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
  }
  function bw(str){
    for(var i=0;i<str.length;){
      var e=Math.min(str.length,i+400000), cc=str.charCodeAt(e-1);
      if(e<str.length&&cc>=0xD800&&cc<=0xDBFF)e++;
      window.AndroidBridge.chunk(str.slice(i,e)); i=e;
    }
  }
  function rodarAuto(force){
    if(!temAuto()||autoBusy||!dbh)return Promise.resolve(false);
    if(!items.length&&!adapt.length&&!lixo.length)return Promise.resolve(false);
    if(!force){
      if(!meta.sujo)return Promise.resolve(false);
      var falta=MIN_AUTO-(Date.now()-(meta.ultimoAuto||0));
      if(meta.ultimoAuto&&falta>0){ agendarAuto(falta+1000); return Promise.resolve(false); }
    }
    autoBusy=true;
    var inicio=meta.sujo||0, nome="CatalogoZero-"+stamp()+".json";
    var done=new Promise(function(res){
      window.__autoDone=function(ok,msg){res({ok:!!ok,msg:msg||""});};
      setTimeout(function(){res({ok:false,msg:"tempo esgotado"});},240000);
    });
    return Promise.resolve().then(function(){
      window.AndroidBridge.beginAuto(nome);
      return streamBackup(bw);
    }).then(function(){ window.AndroidBridge.endAuto(); return done; })
      .catch(function(e){ try{window.AndroidBridge.abortSave();}catch(x){} return {ok:false,msg:String((e&&e.message)||e)}; })
      .then(function(r){
        autoBusy=false;
        if(r.ok){
          meta.autoErro=""; metaSet("autoErro","").catch(function(){});
          metaSet("ultimoAuto",Date.now()).catch(function(){});
          if(meta.sujo===inicio)metaDel("sujo").catch(function(){}); else agendarAuto(MIN_AUTO);
        }else{
          metaSet("autoErro",r.msg||"erro").catch(function(){});
          agendarAuto(10*60*1000);
        }
        render();
        return r.ok;
      });
  }

  /* ---------- gravacao do arquivo de backup (um registro por linha, fotos em base64) ---------- */
  function blobToData(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.readAsDataURL(b);});}
  function dataToBlob(u){
    var i=u.indexOf(","), head=u.slice(0,i), bin=atob(u.slice(i+1)), n=bin.length, a=new Uint8Array(n);
    for(var k=0;k<n;k++)a[k]=bin.charCodeAt(k);
    var m=/^data:([^;,]+)/.exec(head);
    return new Blob([a],{type:m?m[1]:"image/jpeg"});
  }
  function packOne(s,rec){
    var alvo=(s==="x")?rec.reg:rec;
    return Promise.all((alvo.fotos||[]).map(blobToData)).then(function(f){
      var c=Object.assign({},alvo); c.fotos=f;
      var o=(s==="x")?{id:rec.id,tipo:rec.tipo,apagadoEm:rec.apagadoEm,reg:c}:c;
      return JSON.stringify({s:s,o:o});
    });
  }
  function streamBackup(write){
    var lista=[["i",items],["a",adapt],["x",lixo]];
    var tot={i:items.length,a:adapt.length,x:lixo.length};
    var p=Promise.resolve(write(JSON.stringify({app:"catalogo-zero",versao:2,app_versao:VERSAO,exportado:new Date().toISOString(),seq:seq,total:tot})+"\n"));
    lista.forEach(function(par){
      par[1].forEach(function(rec){
        p=p.then(function(){return packOne(par[0],rec);}).then(function(linha){return write(linha+"\n");});
      });
    });
    return p.then(function(){return write(JSON.stringify({fim:true,total:tot})+"\n");});
  }

  /* ---------- fotos ---------- */
  function urlOf(blob){ var u=URL.createObjectURL(blob); urls.push(u); return u; }
  function freeUrls(){ urls.forEach(function(u){URL.revokeObjectURL(u);}); urls=[]; }
  function prep(file){
    var abrir=function(){ return createImageBitmap(file,{imageOrientation:"from-image"}).catch(function(){return createImageBitmap(file);}); };
    return abrir().then(function(bmp){
      var s=Math.min(1,1400/Math.max(bmp.width,bmp.height));
      var w=Math.round(bmp.width*s), h=Math.round(bmp.height*s);
      var c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(bmp,0,0,w,h);
      return new Promise(function(r){c.toBlob(function(b){r(b||file);},"image/jpeg",0.8);});
    }).catch(function(){return file;});
  }

        .then(function(){ window.AndroidBridge.endSave(); })
        .catch(function(e){ try{window.AndroidBridge.abortSave();}catch(x){} throw e; });
    }
    var parts=[];
    return streamBackup(function(s){parts.push(s);}).then(function(){
      var blob=new Blob(parts,{type:"application/json"});
      var f=null; try{f=new File([blob],nome,{type:"application/json"});}catch(e){}
      if(f&&navigator.canShare&&navigator.canShare({files:[f]})&&navigator.share){
        return navigator.share({files:[f],title:"Backup do catálogo"}).catch(function(e){if(e&&e.name==="AbortError")return;throw e;});
      }
      var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nome;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){URL.revokeObjectURL(a.href);},10000);
    });
  }

  /* leitura do arquivo aos pedacos (arquivo grande nao estoura a memoria) */
  function readLines(file,onLine){
    var dec=new TextDecoder("utf-8"), pos=0, STEP=4*1024*1024, rest="";
    function next(){
      if(pos>=file.size){ rest+=dec.decode(); var ultima=rest; rest=""; return ultima?onLine(ultima):null; }
      var end=Math.min(file.size,pos+STEP);
      return file.slice(pos,end).arrayBuffer().then(function(buf){
        pos=end;
        rest+=dec.decode(buf,{stream:true});
        var parts=rest.split("\n"); rest=parts.pop();
        return parts.reduce(function(p,l){return p.then(function(){return l?onLine(l):null;});},Promise.resolve());
      }).then(next);
    }
    return Promise.resolve(next());
  }
  function restaurar(file,progresso){
    var st={ok:0,velho:0,ruim:0,fim:false,header:false,seq:null};
    var idx={i:{},a:{},x:{}};
    items.forEach(function(o){idx.i[o.id]=o;}); adapt.forEach(function(o){idx.a[o.id]=o;}); lixo.forEach(function(o){idx.x[o.id]=o;});
    function fotosBlob(o){
      return (o.fotos||[]).filter(function(u){return typeof u==="string"&&u.indexOf("data:")===0;}).map(dataToBlob);
    }
    function aplicar(s,o){
      if(!o||typeof o.id!=="string"||!o.id){st.ruim++;return Promise.resolve();}
      if(s==="x"){
        if(!o.reg||typeof o.reg.id!=="string"||!o.reg.id||(o.tipo!=="item"&&o.tipo!=="adapt")){st.ruim++;return Promise.resolve();}
        var vivo=(o.tipo==="item"?idx.i:idx.a)[o.reg.id];
        if(vivo||idx.x[o.id]){st.velho++;return Promise.resolve();}
        var rx=Object.assign({},o.reg); rx.fotos=fotosBlob(rx);
        var ex={id:o.id,tipo:o.tipo,apagadoEm:o.apagadoEm||Date.now(),reg:rx};
        return putIt("lixo",ex).then(function(){idx.x[o.id]=ex;st.ok++;});
      }
      if(s!=="i"&&s!=="a"){st.ruim++;return Promise.resolve();}
      var store=(s==="i")?"itens":"adapt", atual=idx[s][o.id];
      if(atual&&(atual.atualizado||0)>=(o.atualizado||0)){st.velho++;return Promise.resolve();}
      var rec=Object.assign({},o); rec.fotos=fotosBlob(rec);
      var kid=(s==="i"?"item":"adapt")+":"+o.id;
      return tx([store,"lixo"],function(t){
        t.objectStore(store).put(rec);
        if(idx.x[kid])t.objectStore("lixo")["delete"](kid);
      }).then(function(){ idx[s][o.id]=rec; delete idx.x[kid]; st.ok++; });
    }
    function onLine(l){
      var r; try{ r=JSON.parse(l); }catch(e){ st.ruim++; return null; }
      if(!r||typeof r!=="object")return null;
      if(!st.header){
        if(r.app==="catalogo-zero"){ st.header=true; st.seq=r.seq||null; return null; }
        throw new Error("formato");
      }
      if(r.fim){ st.fim=true; return null; }
      var p=aplicar(r.s,r.o);
      return p.then(function(){ if(progresso&&((st.ok+st.velho)%10===0))progresso(st.ok+st.velho); });
    }
    function velho(txt){
      var o=JSON.parse(txt);
      if(!o||o.app!=="catalogo-zero"||!Array.isArray(o.itens))throw new Error("formato");
      st.header=true; st.fim=true;
      var seqLista=[];
      (o.itens||[]).forEach(function(x){seqLista.push(["i",x]);});
      (o.adaptacoes||[]).forEach(function(x){seqLista.push(["a",x]);});
      return seqLista.reduce(function(p,par){return p.then(function(){return aplicar(par[0],par[1]);});},Promise.resolve());
    }
    return file.slice(0,300).text().then(function(head){
      var m=/^\s*\{"app":"catalogo-zero","versao":(\d+)/.exec(head);
      if(!m)throw new Error("formato");
      if(parseInt(m[1],10)>=2)return readLines(file,onLine);
      return file.text().then(velho);
    }).then(function(){
      if(!st.header)throw new Error("formato");
      var m2=Object.assign({},meta.seq||{});
      if(st.seq)Object.keys(st.seq).forEach(function(k){ if(!(m2[k]>=st.seq[k]))m2[k]=st.seq[k]; });
      return metaSet("seq",m2);
    }).then(function(){ return st.ok?mudou():null; }).then(loadAll).then(function(){ return st; });
  }

  function openBackup(){
    sheetB.dataset.view="main";
    var auto=temAuto(), n=items.length, na=adapt.length;
    var estado;
    if(auto){
      estado=meta.ultimoAuto?"Última cópia automática: "+quando(meta.ultimoAuto)+".":"A primeira cópia automática é feita alguns segundos depois do primeiro cadastro.";
      if(meta.autoErro)estado+=" Último erro: "+meta.autoErro+".";
    }else{
      estado=meta.ultimoManual?"Último backup: "+quando(meta.ultimoManual)+".":"Você ainda não fez backup neste aparelho.";
    }
    sheetB.innerHTML=
      '<div class="sheet-bar"><button class="btn ghost" type="button" id="bBack">Voltar</button><h2>Backup</h2><span style="width:60px"></span></div>'
      +'<div class="sheet-in">'
      +'<p class="note">'+(auto
        ?'Seus dados ficam guardados neste celular. O app também salva uma cópia sozinho na pasta <b>Downloads/CatalogoZero</b> (guarda as últimas 10 datas). Essa cópia continua lá mesmo se você desinstalar o app ou trocar de celular (leve o arquivo junto).'
        :'Os itens, as adaptações e as fotos ficam guardados só neste aparelho. Se você limpar os dados do navegador, trocar de aparelho ou desinstalar, eles somem. Faça backup de vez em quando e guarde o arquivo no WhatsApp, no Drive ou no computador.')+'</p>'
      +'<div class="box"><h3>Guardar backup</h3><p class="note" id="bEstado">'+esc(estado)+'<br>Agora: '+n+(n===1?" item":" itens")+' e '+na+(na===1?" adaptação":" adaptações")+'.</p>'
      +(auto?'<button class="btn primary" type="button" id="bAuto">Salvar cópia agora em Downloads</button>':'')
      +'<button class="btn'+(auto?'':' primary')+'" type="button" id="bExp">'+(auto?'Enviar arquivo de backup (WhatsApp, Drive…)':'Gerar arquivo de backup')+'</button></div>'
      +'<div class="box"><h3>Restaurar backup</h3><p class="note">Escolha um arquivo de backup. Ele é somado ao que já existe aqui: o que você já tem nunca é apagado, e um registro só é trocado se o do arquivo for mais novo.</p><button class="btn" type="button" id="bImp">Escolher arquivo</button><input type="file" id="bFile" accept=".json,application/json,text/plain" hidden><p class="note" id="bMsg" role="status"></p></div>'
      +'<div class="box"><h3>Itens apagados ('+lixo.length+')</h3><p class="note">Tudo que você exclui vai para cá e fica 90 dias. Dá para recuperar.</p><button class="btn" type="button" id="bLixo">Ver itens apagados</button></div>'
      +'<p class="note" id="bUso">Catálogo Zero versão '+VERSAO+'</p>'
      +'</div>';
    sheetB.hidden=false; sheetB.scrollTop=0;
    try{ if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(function(e){ var el=$("#bUso"); if(el&&e&&e.usage)el.textContent="Catálogo Zero versão "+VERSAO+" · espaço usado: "+(e.usage/1048576).toFixed(1).replace(".",",")+" MB"; }).catch(function(){}); }catch(e){}
    $("#bBack").onclick=function(){sheetB.hidden=true;sheetB.innerHTML="";};
    $("#bLixo").onclick=openLixo;
    var ba=$("#bAuto");
    if(ba)ba.onclick=function(){
      if(!items.length&&!adapt.length&&!lixo.length){toast("Ainda não há nada para salvar.");return;}
      ba.disabled=true; ba.textContent="Salvando…";
      rodarAuto(true).then(function(ok){ toast(ok?"Cópia salva em Downloads/CatalogoZero":"Não consegui salvar a cópia. Use Enviar arquivo de backup."); if(!sheetB.hidden&&sheetB.dataset.view==="main")openBackup(); });
    };
    $("#bExp").onclick=function(){
      var btn=$("#bExp"), txt=btn.textContent; btn.disabled=true; btn.textContent="Gerando…";
      exportManual().then(function(){ metaSet("ultimoManual",Date.now()).catch(function(){}); toast("Backup gerado"); })
        .catch(function(){toast("Não consegui gerar o backup.");})
        .then(function(){btn.disabled=false;btn.textContent=txt;});
    };
    $("#bImp").onclick=function(){$("#bFile").click();};
    $("#bFile").addEventListener("change",function(){
      var f=this.files&&this.files[0]; this.value=""; if(!f)return;
      var msg=$("#bMsg"), bi=$("#bImp"); bi.disabled=true; msg.textContent="Lendo o arquivo…";
      restaurar(f,function(k){ msg.textContent="Restaurando… "+k+" registros"; }).then(function(st){
        var t=st.ok+(st.ok===1?" registro restaurado":" registros restaurados");
        if(st.velho)t+=", "+st.velho+" já estavam atualizados aqui";
        if(st.ruim)t+=", "+st.ruim+" ignorados (com defeito)";
        if(!st.fim)t+=". ATENÇÃO: o arquivo está incompleto (foi cortado). Use um backup mais recente se tiver.";
        render();
        var m2=$("#bMsg"); if(m2)m2.textContent=t;
        toast(st.ok+(st.ok===1?" registro restaurado":" registros restaurados"));
      }).catch(function(e){
        var m3=$("#bMsg"); if(m3)m3.textContent=(e&&e.message==="formato")?"Esse arquivo não é um backup do catálogo.":"Não consegui restaurar. O que já estava aqui continua intacto.";
        loadAll().then(render).catch(function(){});
      }).then(function(){var b2=$("#bImp"); if(b2)b2.disabled=false;});
    });
  }
  function openLixo(){
    sheetB.dataset.view="lixo";
    var lista=lixo.slice().sort(function(a,b){return (b.apagadoEm||0)-(a.apagadoEm||0);});
    sheetB.innerHTML=
      '<div class="sheet-bar"><button class="btn ghost" type="button" id="bBack">Voltar</button><h2>Itens apagados</h2><span style="width:60px"></span></div>'
      +'<div class="sheet-in">'
      +(lista.length?lista.map(function(e){
        var r=e.reg||{}, nome=(e.tipo==="item")?((r.cod||"")+" · "+(r.nome||"")):("Adaptação · "+(r.modelo||""));
        return '<div class="box"><div class="cod">'+(e.tipo==="item"?esc(r.tipo||"Item"):"Adaptação")+'</div><div class="cname">'+esc(nome)+'</div><p class="note">Apagado '+esc(quando(e.apagadoEm))+'</p>'
          +'<div class="row"><button class="btn primary" type="button" data-rec="'+esc(e.id)+'">Recuperar</button><button class="btn danger" type="button" data-del="'+esc(e.id)+'" data-txt="Apagar de vez">Apagar de vez</button></div></div>';
      }).join(""):'<div class="empty"><strong>Lixeira vazia</strong>O que você excluir aparece aqui por 90 dias.</div>')
      +'</div>';
    sheetB.hidden=false; sheetB.scrollTop=0;
    $("#bBack").onclick=openBackup;
    sheetB.querySelectorAll("[data-rec]").forEach(function(b){
      b.onclick=function(){
        var e=lixo.filter(function(x){return x.id===b.dataset.rec;})[0]; if(!e)return;
        b.disabled=true;
        recuperar(e).then(loadAll).then(function(){render();openLixo();toast("Recuperado");}).catch(function(){b.disabled=false;toast("Não consegui recuperar.");});
      };
    });
    sheetB.querySelectorAll("[data-del]").forEach(function(b){
      armDelete(b,function(done){
        var e=lixo.filter(function(x){return x.id===b.dataset.del;})[0]; if(!e){done();return;}
        apagarDeVez(e).then(loadAll).then(function(){openLixo();toast("Apagado de vez");}).catch(function(){done();toast("Não consegui apagar.");});
      });
    });
  }
  $("#btnBackup").onclick=openBackup;

  /* ---------- início ---------- */
  try{
    var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
    if(ios&&!navigator.standalone&&!localStorage.getItem("dica-zero"))$("#dica").hidden=false;
    $("#dicaX").onclick=function(){$("#dica").hidden=true;try{localStorage.setItem("dica-zero","1");}catch(e){}};
  }catch(e){}
  var lastErr=0;
  function erroGeral(){ if(Date.now()-lastErr>5000){lastErr=Date.now();toast("Erro inesperado. Se repetir, gere um backup e avise.");} }
  window.addEventListener("error",erroGeral);
  window.addEventListener("unhandledrejection",erroGeral);
  window.__autoDone=function(){};
  openDb().then(function(h){dbh=h;return loadAll();}).then(function(){
    var agora=Date.now(), velhos=lixo.filter(function(e){return (e.apagadoEm||0)<agora-90*DIA;});
    var p=Promise.resolve();
    if(!meta.criadoEm)p=p.then(function(){return metaSet("criadoEm",agora);});
    velhos.forEach(function(e){ p=p.then(function(){return run("lixo","readwrite",function(s){return s["delete"](e.id);});}); });
    return p.then(function(){return velhos.length?loadAll():null;});
  }).then(function(){
    render();
    if(meta.sujo)agendarAuto(8000);
  }).catch(function(){main.innerHTML='<div class="empty"><strong>Sem armazenamento</strong>O app não conseguiu abrir o banco de dados do celular. Feche o app e abra de novo. Se continuar, restaure o backup mais recente.</div>';});
  try{ if(navigator.storage&&navigator.storage.persist)navigator.storage.persist(); }catch(e){}
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="hidden"){ salvarRascunhoJa(); if(meta.sujo)agendarAuto(1500); }
  });
  window.addEventListener("pagehide",function(){ salvarRascunhoJa(); });
  window.__voltar=function(){
    if(!$("#zoom").hidden){$("#zoom").hidden=true;return true;}
    if(!sheetF.hidden){ if(curForm){cancelarForm();}else{sheetF.hidden=true;sheetF.innerHTML="";} return true; }
    if(!sheetB.hidden){ if(sheetB.dataset.view==="lixo"){openBackup();}else{sheetB.hidden=true;sheetB.innerHTML="";} return true; }
    if(!sheetD.hidden){popDetail();return true;}
    return false;
  };
  if("serviceWorker" in navigator&&!window.AndroidBridge){ window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});}); }
})();
