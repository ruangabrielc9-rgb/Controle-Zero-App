plugins {
    id 'com.android.application'
}

android {
    namespace 'br.bancadazero.controle'
    compileSdk 34

    defaultConfig {
        applicationId "br.bancadazero.controle"
        minSdk 21
        targetSdk 34
        versionCode 8
        versionName "1.7"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assinado com a chave de debug do ambiente de build (instalacao direta, fora da Play Store).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
