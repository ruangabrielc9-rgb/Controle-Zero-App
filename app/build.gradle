plugins {
    id 'com.android.application'
}

android {
    namespace 'br.bancadazero.catalogo'
    compileSdk 34

    defaultConfig {
        applicationId "br.bancadazero.catalogo"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        catalogo {
            // Chave fixa: assim cada versao nova instala por cima da anterior sem apagar os dados do app.
            storeFile file('catalogo.keystore')
            storeType 'pkcs12'
            storePassword 'catalogo2026'
            keyAlias 'catalogo'
            keyPassword 'catalogo2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.catalogo
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
