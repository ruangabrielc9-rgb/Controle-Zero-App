plugins {
    id 'com.android.application'
}

android {
    namespace 'br.bancadazero.catalogo'
    compileSdk 34

    defaultConfig {
        applicationId "br.bancadazero.catalogo"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assinado com a chave de debug do ambiente de build (instalacao direta, fora da Play Store).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
